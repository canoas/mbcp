  /services/parties/payee-information/inquiry:
    post:
      tags:
        - B2B Inquiring
      summary: B2B ACCOUNT PAYEE INFORMATION API
      description: This operation allows you to retrieve the payee information for a specific account. The request must include the account details for which the payee information is to be retrieved.
      operationId: AccountPayeeInformationInquiry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPayeeInformationRequest'
            example:
              AcctInqRq:
                RqUID: 4ad740a6-ed00-446e-8fcb-20674aaf6275
