                        Severity: Error
                        SubjectElement: 'AcctInqRq.AcctSel[0].AcctKeys.AcctIdent.AcctIdentValue'
                      - StatusCode: 1020
                        StatusDesc: The AcctIdentValue field must start with 2 uppercase letters followed by alphanumeric characters.
