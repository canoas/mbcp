openapi: 3.0.1
info:
  title: B2B Accounts
  description: 'Perform banking inquiries and transactions directly from your management software with the B2B Millennium API. If you are interested, please contact us at this email address: api.integration@millenniumbcp.pt'
  version: v1-mock
servers:
  - url: https://apiqa.millenniumbcp.pt/b2bInquiring/v1-mock
paths:
  /services/accounts/balances/inquiry:
    post:
      tags:
        - B2B Inquiring
      summary: B2B ACCOUNTS BALANCES API
      description: This operation allows you to retrieve the current balances for one or more accounts. The request must include the account details for which the balances are to be retrieved.
      operationId: AccountsBalancesInquiry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountBalancesRequest'
            example:
              AcctInqRq:
                RqUID: 39ecd6bd-ce67-46e7-8309-78086c21aab7
                MsgRqHdr:
                  ContextRqHdr:
                    ClientDt: '2026-08-21T16:34:13.8090000+00:00'
                    CustLangPref: PT
                    ClientApp:
                      Org: Millennium bcp
                      Name: testClientAppName
                      Version: 1.0.0
                AcctSel:
                  - AcctKeys:
                      AcctIdent:
                        AcctIdentType: BBAN
                        AcctIdentValue: '1372742'
                      AcctType: DDA
                      CurCode:
                        CurCodeValue: EUR
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalancesResponse'
              example:
                AcctInqRs:
                  AcctRec:
                    - AcctId: '1372742'
                      AcctInfo:
                        AcctBal:
                          - BalType: Ledger
                            CurAmt:
                              Amt: 482796.36
                              CurCode:
                                CurCodeValue: EUR
                          - BalType: Avail
                            CurAmt:
                              Amt: 482796.36
                              CurCode:
                                CurCodeValue: EUR
                          - BalType: Current
                            CurAmt:
                              Amt: 482796.36
                              CurCode:
                                CurCodeValue: EUR
                      AcctStatus:
                        AcctStatusCode: Success
                        EffDt: '2026-08-21T17:34:21.3560000+00:00'
                  RqUID: 39ecd6bd-ce67-46e7-8309-78086c21aab7
                  Status:
                    StatusCode: 0
                    StatusDesc: Success
                    Severity: Info
                  MsgRsHdr:
                    ContextRsHdr:
                      ServerDt: '2026-08-21T16:34:45.3649801+00:00'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalancesErrorResponse'
              example:
                AcctInqRs:
                  RqUID: 5d2c3170-b3a8-406d-bee2-a3e930b1e144
                  Status:
                    StatusCode: 1020
                    StatusDesc: Required element not included.
                    Severity: Error
                    AdditionalStatus:
                      - StatusCode: 1020
                        StatusDesc: 'The AcctInqRq.AcctSel[0].AcctKeys.AcctIdent.AcctIdentValue field is required.'
                        Severity: Error
                        SubjectElement: 'AcctInqRq.AcctSel[0].AcctKeys.AcctIdent.AcctIdentValue'
                  MsgRsHdr:
                    ContextRsHdr:
                      ServerDt: '2026-08-21T16:53:38.9330531+00:00'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalancesErrorResponse'
              example:
                AcctInqRs:
                  RqUID: ''
                  Status:
                    StatusCode: 100
                    StatusDesc: Unexpected error while consulting account balances
                    Severity: Error
                    AdditionalStatus:
                      - StatusCode: 500
                        StatusDesc: 'An item with the same key has already been added. Key: AcctIdentValue (Parameter ''key'')'
                        Severity: Error
                        SubjectElement: Exception
                  MsgRsHdr:
                    ContextRsHdr:
                      ServerDt: '2026-08-21T16:52:10.9115992+00:00'
        '502':
          description: Bad Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBalancesErrorResponse'
              example:
                AcctInqRs:
                  RqUID: cc405a48-c8bc-42a5-a698-89d49a759c3b
                  Status:
                    StatusCode: 100
                    StatusDesc: Error while consulting account balances
                    Severity: Error
                    AdditionalStatus:
                      - StatusCode: 502
                        StatusDesc: 'SERVICE_ERROR: Conta não pertence ao Patrimonio.'
                        Severity: Error
                        SubjectElement: Exception
                  MsgRsHdr:
                    ContextRsHdr:
                      ServerDt: '2026-08-21T16:51:01.4309438+00:00'
