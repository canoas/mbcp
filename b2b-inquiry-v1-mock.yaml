                          FIIdentType: BICSWIFT
                          RefData:
                            - RefType: Address1
                              RefIdent: 50 AVENUE PIERRE MENDES FRANCE
                            - RefType: City
                              RefIdent: PARIS
                            - RefType: Country
                              RefIdent: FRANCE
                            - RefType: Sepa
                              RefIdent: S
                          Name: 'CAISSES D''EPARGNE-GROUPE BPCE '
                      AcctStatus:
                        AcctStatusCode: Success
                        EffDt: '2026-08-24T13:53:01.3966368+00:00'
