                      Org: Millennium bcp
                      Name: testClientAppName
                      Version: 1.0.0
                AcctSel:
                  - AcctKeys:
                      AcctIdent:
                        AcctIdentType: IBAN
                        AcctIdentValue: FR7617515900000476128824455
                      AcctType: DDA
                      CurCode:
                        CurCodeValue: EUR
                      FIIdentType: BICSWIFT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPayeeInformationResponse'
